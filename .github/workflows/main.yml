import "dotenv/config";
import express from "express";
import admin from "firebase-admin";

const app = express();
app.use(express.json({limit:"2mb"}));
const {PORT=3000,TELEGRAM_BOT_TOKEN,FIREBASE_PROJECT_ID,FIREBASE_CLIENT_EMAIL,FIREBASE_PRIVATE_KEY,INTERNAL_API_KEY}=process.env;
if(!TELEGRAM_BOT_TOKEN||!FIREBASE_PROJECT_ID||!FIREBASE_CLIENT_EMAIL||!FIREBASE_PRIVATE_KEY){console.error("Missing required environment variables");process.exit(1)}
admin.initializeApp({credential:admin.credential.cert({projectId:FIREBASE_PROJECT_ID,clientEmail:FIREBASE_CLIENT_EMAIL,privateKey:FIREBASE_PRIVATE_KEY.replace(/\\n/g,"\n")})});
const db=admin.firestore();
const tg=async(method,body={})=>{const r=await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/${method}`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!d.ok){const e=new Error(d.description||"Telegram API error");e.telegram=d;throw e}return d.result};
const internalOnly=(req,res,next)=>{if(!INTERNAL_API_KEY)return res.status(500).json({ok:false,error:"INTERNAL_API_KEY is not configured"});if(req.get("x-opsads-key")!==INTERNAL_API_KEY)return res.status(401).json({ok:false,error:"Unauthorized"});next()};
const chatId=v=>{if(typeof v!=="string"&&typeof v!=="number")throw new Error("channelId is required");return String(v).trim()};
async function verifyChannel(channelId){const chat=await tg("getChat",{chat_id:channelId});const me=await tg("getMe");const member=await tg("getChatMember",{chat_id:channelId,user_id:me.id});const isAdmin=member.status==="administrator"||member.status==="creator";const canPost=member.status==="creator"||(member.status==="administrator"&&member.can_post_messages===true);return {ok:true,botId:me.id,channelId:String(chat.id),title:chat.title||"",username:chat.username?`@${chat.username}`:"",type:chat.type,botStatus:member.status,isAdmin,canPost,verified:isAdmin&&canPost}};
app.get("/health",(req,res)=>res.json({ok:true,service:"OpsAds Telegram Backend",time:new Date().toISOString()}));
app.post("/api/channel/verify",async(req,res)=>{try{const channelId=chatId(req.body.channelId);const uid=String(req.body.uid||"").trim();if(!uid)return res.status(400).json({ok:false,error:"uid is required"});const result=await verifyChannel(channelId);const ref=db.collection("channels").doc();await ref.set({uid,channelId:result.channelId,username:result.username,channelName:result.title,botStatus:result.botStatus,botIsAdmin:result.isAdmin,botCanPost:result.canPost,verified:result.verified,status:result.verified?"pending_admin_approval":"waiting_for_bot_access",dailyAdLimit:Number(req.body.dailyAdLimit||5),cpm:Number(req.body.cpm||0.7),createdAt:admin.firestore.FieldValue.serverTimestamp(),updatedAt:admin.firestore.FieldValue.serverTimestamp()});res.json({ok:true,channelDocId:ref.id,verification:result,message:result.verified?"Bot verified. Waiting for OpsAds admin approval.":"Please add the OpsAds bot as an administrator with permission to post messages."})}catch(e){res.status(400).json({ok:false,error:e.message,telegram:e.telegram?.description||null})}});
app.post("/api/channel/recheck",async(req,res)=>{try{const id=String(req.body.channelDocId||"").trim();if(!id)return res.status(400).json({ok:false,error:"channelDocId is required"});const ref=db.collection("channels").doc(id);const snap=await ref.get();if(!snap.exists)return res.status(404).json({ok:false,error:"Channel not found"});const data=snap.data();const result=await verifyChannel(data.channelId);await ref.update({botStatus:result.botStatus,botIsAdmin:result.isAdmin,botCanPost:result.canPost,verified:result.verified,status:result.verified?(data.status==="active"?"active":"pending_admin_approval"):"waiting_for_bot_access",updatedAt:admin.firestore.FieldValue.serverTimestamp()});res.json({ok:true,verification:result})}catch(e){res.status(400).json({ok:false,error:e.message,telegram:e.telegram?.description||null})}});
const day=()=>new Date().toISOString().slice(0,10);
async function countToday(channelDocId){const s=await db.collection("adDeliveries").where("channelDocId","==",channelDocId).where("day","==",day()).get();return s.size}
async function postCampaign(campaign,channel){const used=await countToday(channel.id);const limit=Number(channel.dailyAdLimit||5);if(used>=limit)return {skipped:true,reason:"daily_limit_reached"};const text=[campaign.title?`📢 ${campaign.title}`:"",campaign.description||"",campaign.link?`🔗 ${campaign.link}`:""].filter(Boolean).join("\n\n").trim()||"Sponsored post";let sent;if(campaign.imageUrl)sent=await tg("sendPhoto",{chat_id:channel.channelId,photo:campaign.imageUrl,caption:text.slice(0,1024)});else sent=await tg("sendMessage",{chat_id:channel.channelId,text});const ref=db.collection("adDeliveries").doc();await ref.set({campaignId:campaign.id,channelDocId:channel.id,channelId:channel.channelId,telegramMessageId:sent.message_id,day:day(),initialViews:Number(sent.views||0),views:Number(sent.views||0),createdAt:admin.firestore.FieldValue.serverTimestamp(),updatedAt:admin.firestore.FieldValue.serverTimestamp()});return {posted:true,deliveryId:ref.id,telegramMessageId:sent.message_id}}
app.post("/api/campaigns/:campaignId/dispatch",internalOnly,async(req,res)=>{try{const id=req.params.campaignId;const cr=db.collection("campaigns").doc(id);const cs=await cr.get();if(!cs.exists)return res.status(404).json({ok:false,error:"Campaign not found"});const campaign={id:cs.id,...cs.data()};if(!["approved","active"].includes(campaign.status))return res.status(400).json({ok:false,error:"Campaign is not approved/active"});const channels=await db.collection("channels").where("status","==","active").where("verified","==",true).get();const results=[];for(const d of channels.docs){try{results.push({channelDocId:d.id,...await postCampaign(campaign,{id:d.id,...d.data()})})}catch(e){results.push({channelDocId:d.id,posted:false,error:e.message})}}await cr.update({lastDispatchAt:admin.firestore.FieldValue.serverTimestamp(),updatedAt:admin.firestore.FieldValue.serverTimestamp()});res.json({ok:true,campaignId:id,channelsChecked:channels.size,results})}catch(e){res.status(500).json({ok:false,error:e.message})}});
app.get("/api/publisher/:uid/summary",internalOnly,async(req,res)=>{try{const uid=req.params.uid;const channels=await db.collection("channels").where("uid","==",uid).get();let impressions=0,earnings=0;for(const c of channels.docs){const cpm=Number(c.data().cpm||0.7);const ds=await db.collection("adDeliveries").where("channelDocId","==",c.id).get();for(const d of ds.docs){const v=Number(d.data().views||0);impressions+=v;earnings+=(v/1000)*cpm}}res.json({ok:true,uid,channels:channels.size,impressions,earnings:Number(earnings.toFixed(4))})}catch(e){res.status(500).json({ok:false,error:e.message})}});
app.listen(PORT,()=>console.log(`OpsAds backend running on ${PORT}`));
